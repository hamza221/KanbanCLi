services:
  clikanban:
    build: .
    container_name: clikanban
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - boards:/app/boards
      - data:/app/data
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - KANBAN_DB_PATH=/app/data/kanban.db

volumes:
  boards:
  data:
