name: Dependabot auto-merge

# Approves and enables auto-merge on Dependabot PRs. GitHub's native auto-merge
# only completes the merge once every required status check (CI Tests, Build,
# Lint, ...) passes, so failing CI blocks the merge automatically.
#
# Requires, on the repository settings:
#   - "Allow auto-merge" enabled
#   - A branch protection rule on `main` with the CI checks marked as required

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve the pull request
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only auto-merge minor and patch bumps; major updates are left for a human.
      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
